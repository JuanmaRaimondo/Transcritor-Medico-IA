name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------
  # Job 1: Integración Continua del BackEnd
  # ---------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest
    
    # Levanta MongoDB en el entorno de GitHub Actions para los tests
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Crea el archivo con tus credenciales reales almacenadas de forma segura
      - name: Crear google-credentials.json Real
        run: |
          mkdir -p BackEnd/src/main/resources
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > BackEnd/src/main/resources/google-credentials.json

      - name: Compilar y Ejecutar Pruebas del BackEnd
        working-directory: ./BackEnd
        run: |
          chmod +x mvnw
          ./mvnw clean test
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/informes_medicos_db

  # ---------------------------------------------
  # Job 2: Integración Continua del FrontEnd
  # ---------------------------------------------
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './FrontEnd/package-lock.json'

      - name: Instalar dependencias
        working-directory: ./FrontEnd
        run: npm ci

      - name: Validar Linting
        working-directory: ./FrontEnd
        run: npm run lint

      - name: Compilar FrontEnd (Build de Producción)
        working-directory: ./FrontEnd
        run: npm run build

  # ---------------------------------------------
  # Job 3: Despliegue Continuo (CD) en el VPS
  # ---------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Desplegar en el VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Ir al directorio del proyecto en el VPS
            cd /root/proyectos/Transcritor-Medico-IA || { echo "ERROR: no se encontró el directorio del proyecto"; exit 1; }
            
            # Obtener los últimos cambios de la rama main
            git pull origin main
            
            # Re-compilar y levantar los contenedores con docker-compose
            docker compose down
            docker compose up --build -d
            
            # Limpiar imágenes obsoletas para no llenar el disco
            docker image prune -f